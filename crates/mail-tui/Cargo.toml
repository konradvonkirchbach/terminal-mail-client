[package]
name = "mail-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mailc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
mail-core = { path = "../mail-core" }
notify = "8.2.0"
notify-rust = "4.18.0"
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
