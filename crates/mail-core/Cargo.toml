[package]
name = "mail-core"
version.workspace = true
edition.workspace = true

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
chrono = { workspace = true, features = ["serde"] }
directories.workspace = true
futures = "0.3.34"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
mail-parser = "0.11.8"
mime_guess = "2.0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = "0.23.43"
rustls-native-certs = "0.8.4"
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-rustls = "0.26.5"
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
