[workspace]
resolver = "2"
members = ["crates/mail-core", "crates/mail-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Versions shared by both crates, kept in one place so they can't drift.
[workspace.dependencies]
chrono = "0.4.45"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = "1.53.1"
toml = "1.1.5"
tracing = "0.1.44"

[profile.release]
lto = true
strip = true
